<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — MSOP Panel</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f8cff'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>M</text></svg>">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="brand"><span class="cube">M</span><span>MSOP Panel<small>MINECRAFT SERVER PANEL</small></span></div>
    <p class="tag">Your servers. One panel.</p>
    <div class="login-err" id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label>Username</label>
        <input id="username" autocomplete="username" autofocus placeholder="admin">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>
<div id="toasts"></div>
<script src="/js/common.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("err");
  err.style.display = "none";
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const r = await api("/api/auth/login", {
      method: "POST",
      body: JSON.stringify({
        username: document.getElementById("username").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    if (!r.ok) throw new Error(r.data.error || "Login failed");
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
